algorithm_description: return fire polygons that atl08 post fire intersects
algorithm_name: boreal_unet_coincident_fire_atl08
algorithm_version: dev
build_command: boreal_unet_data_prep/build-env.sh
disk_space: 80GB
docker_container_url: mas.maap-project.org/root/maap-workspaces/custom_images/maap_base:v4.3.0
inputs:
  config: []
  positional:
  - default: ''
    description: boreal tile number to run
    name: tile_num
    required: true
  - default: ''
    description: fire path
    name: fire_path
    required: true
  - default: ''
    description: years of atl08 to compare against fire polygons
    name: atl08_years
    required: true
  - default: ''
    description: atl08 s3 paths
    name: atl08_paths
    required: true
  - default: ''
    description: hls s3 path
    name: hls_path
    required: true

queue: maap-dps-worker-32gb
repository_url: https://github.com/aliz237/boreal_unet_data_prep
run_command: boreal_unet_data_prep/run-coincident_fire_atl08.sh
